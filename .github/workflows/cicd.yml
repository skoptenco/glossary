name: CI/CD

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Login to DockerHub
      run: |
        echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login \
          -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

    - name: Build & Push
      run: |
        docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/glossary-web:latest .
        docker push ${{ secrets.DOCKERHUB_USERNAME }}/glossary-web:latest

    - name: Deploy to server
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SERVER_SSH_KEY }}
        script: |
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/glossary-web:latest
            docker stop glossary-web || true
            docker rm glossary-web || true
            docker run -d --name glossary-web -p 8000:8000 ${{ secrets.DOCKERHUB_USERNAME }}/glossary-web:latest